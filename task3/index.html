<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌤️ Weather Dashboard</h1>
        <p class="subtitle">Check real-time weather information</p>

        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name"
            >

            <button id="searchBtn">Search</button>
        </div>

        <p id="errorMessage"></p>

        <div class="weather-card" id="weatherCard">

            <h2 id="cityName">Hyderabad</h2>

            <div class="weather-icon" id="weatherIcon">🌤️</div>

            <h3 id="temperature">--°C</h3>

            <p id="description">Search for a city</p>

            <div class="weather-details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="windSpeed">-- km/h</strong>
                </div>

            </div>

        </div>
        <!-- Interactive Quiz -->

    <div class="quiz-section">

        <h2>🧠 Web Development Quiz</h2>

        <p id="question">Question will appear here</p>

        <div class="options">

            <button class="option" id="option1"></button>
            <button class="option" id="option2"></button>
            <button class="option" id="option3"></button>
            <button class="option" id="option4"></button>

        </div>

        <p id="quizResult"></p>

        <p id="score">Score: 0</p>

        <button id="nextBtn">Next Question</button>

    </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
