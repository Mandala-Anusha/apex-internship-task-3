<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Store</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <header>

        <h1>Product Store</h1>

        <p>
            Search, filter and sort products
        </p>

    </header>


    <main class="container">


        <!-- Controls -->

        <div class="controls">


            <input
                type="search"
                id="search"
                placeholder="Search products..."
            >


            <select id="category">

                <option value="all">
                    All Categories
                </option>

                <option value="electronics">
                    Electronics
                </option>

                <option value="fashion">
                    Fashion
                </option>

                <option value="home">
                    Home
                </option>

                <option value="books">
                    Books
                </option>

            </select>


            <select id="price">

                <option value="all">
                    All Prices
                </option>

                <option value="500">
                    Under ₹500
                </option>

                <option value="1000">
                    Under ₹1000
                </option>

                <option value="2000">
                    Under ₹2000
                </option>

                <option value="5000">
                    Under ₹5000
                </option>

            </select>


            <select id="sort">

                <option value="default">
                    Sort By
                </option>

                <option value="priceLow">
                    Price: Low to High
                </option>

                <option value="priceHigh">
                    Price: High to Low
                </option>

                <option value="ratingHigh">
                    Rating: High to Low
                </option>

                <option value="ratingLow">
                    Rating: Low to High
                </option>

            </select>


        </div>


        <p id="resultCount"></p>


        <!-- Products -->

        <section
            id="products"
            class="products"
        ></section>


    </main>


    <script src="script.js"></script>

</body>

</html>
